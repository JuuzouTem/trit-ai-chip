# Tiny Tapeout Çip Kimlik Kartı
project:
  title:        "Trit AI NPU"
  author:       "JuuzouTem"
  discord:      ""
  description:  "4-Core Ternary 1.58-Bit GEMM Neural Accelerator"
  language:     "Verilog"
  clock_hz:     10000000

  # Çipin kaplayacağı silikon alan
  tiles: "1x1"

  # En üst modül adı
  top_module:  "tt_um_example"

  # Kaynak dosyamız
  source_files:
    - "project.v"

# Zorunlu Şablon Versiyonu (Sistemin aradığı satır)
yaml_version: 6

# Çip Kataloğu Belgeleri
documentation: 
  author:       "JuuzouTem"
  title:        "Trit AI NPU"
  language:     "Verilog"
  description:  "4-Core Ternary 1.58-Bit GEMM Neural Accelerator"

  how_it_works:   "Processes 1.58-bit ternary weights without multipliers using INT adders and ReLU."
  how_to_test:    "Set ui_in[0]=1 to START. Observe done on uio_out[0] and result on uo_out."

  inputs:
    - start
    - neuron_sel[0]
    - neuron_sel[1]
    - none
    - none
    - none
    - none
    - none
  outputs:
    - out0
    - out1
    - out2
    - out3
    - out4
    - out5
    - out6
    - out7
  bidirectional:
    - done
    - none
    - none
    - none
    - none
    - none
    - none
    - none
